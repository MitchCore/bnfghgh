<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>РФ ТВ IPTV</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://ngrch.github.io" crossorigin>
<link rel="preconnect" href="https://iptv-org.github.io" crossorigin>

<script>
tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #05070a; color: #f8fafc; overflow: hidden; font-family: 'Inter', sans-serif; }

/* Стекло */
.glass { background: rgba(13,17,26,.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.08); }
.glass-btn { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); transition: all .2s; }
.glass-btn:hover, .glass-btn:focus { background: rgba(255,255,255,.15); border-color: rgba(96,165,250,.5); transform: scale(1.05); }

/* Скроллбар */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: rgba(100,116,139,.5); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

/* Анимации */
@keyframes pulseLive { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.live-dot { animation: pulseLive 1.8s infinite ease-in-out; }

@keyframes spin { 100% { transform: rotate(360deg); } }
.spinner-ring { width: 50px; height: 50px; border: 4px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }

/* Оптимизация */
.channel-card { content-visibility: auto; contain-intrinsic-size: 72px; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

/* Скрытие OSD */
.osd-hidden { opacity: 0; pointer-events: none; }
.osd-visible { opacity: 1; pointer-events: auto; }

.fav-btn.active { color: #fbbf24; }
</style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

<!-- ===== ВИДЕО ===== -->
<div id="playerContainer" class="relative w-full h-full bg-black flex items-center justify-center overflow-hidden">
    <!-- Атрибут muted убран, чтобы пробовать включать со звуком -->
    <video id="videoPlayer" class="w-full h-full object-contain" playsinline autoplay preload="auto" crossorigin="anonymous"></video>

    <!-- Экран загрузки -->
    <div id="loaderOverlay" class="absolute inset-0 bg-black flex flex-col items-center justify-center z-30 transition-opacity duration-300">
        <div class="spinner-ring mb-6"></div>
        <p id="loaderText" class="text-xl font-bold text-white tracking-wide">Загрузка...</p>
        <p id="loaderSubText" class="text-sm text-slate-400 mt-2">Соединение...</p>
    </div>

    <!-- Ошибка -->
    <div id="errorOverlay" class="hidden absolute inset-0 bg-black/95 flex flex-col items-center justify-center z-40 p-6 text-center">

            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <h3 class="text-xl font-bold text-white mb-2">Поток недоступен</h3>

        <div class="flex flex-wrap gap-3 justify-center">

            <button id="openSidebarFromErrorBtn" type="button" class="glass-btn px-6 py-3 rounded-xl text-white font-semibold text-sm cursor-pointer">📺 Список</button>

            <div class="flex items-center gap-3">

<script>
'use strict';
const $ = id => document.getElementById(id);
const PAGE = 60;

// ===== ИСТОЧНИКИ =====
const PRIMARY_SOURCE = { name: 'ngrch', url: 'https://ngrch.github.io/iptv/ru.m3u', cat: 'Русские' };
const SECONDARY_SOURCES = [
    { name: 'iptv-org RU', url: 'https://iptv-org.github.io/iptv/countries/ru.m3u', cat: 'Русские' },
    { name: 'Free-TV', url: 'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8', cat: 'Все' },
    { name: 'DropTV', url: 'https://raw.githubusercontent.com/IPTVRU2026/IPTVMIR/main/IPTV_MEGA_PLAYLIST.m3u', cat: 'Все' },
    { name: 'kittv Kids', url: 'https://kittv.ru/detkanaly.m3u', cat: 'Детские' },
    { name: 'kittv Movies', url: 'https://kittv.ru/films.m3u', cat: 'Кино' }
];

// ===== КАТЕГОРИИ =====
const CATS = [
    ['Все', 'Все', '📺'], ['Русские', 'Русские', '🇷🇺'], ['Новости', 'Новости', '📰'],
    ['Спорт', 'Спорт', '⚽'], ['Кино', 'Кино', '🎬'], ['Детские', 'Детские', '🧸'],
    ['Музыка', 'Музыка', '🎵'], ['Избранное', 'Избранное', '⭐']
];

// ===== СОСТОЯНИЕ =====
const S = {
    channels: [], favs: new Set(),
    idx: 0, cat: 'Все', q: '', hls: null,
    status: {}, sidebar: true, osdT: null
};

let visible = PAGE;
const video = $('videoPlayer');
const container = $('channelsListContainer');

// ===== УТИЛИТЫ =====
const debounce = (fn, ms) => { let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a),ms); }; };
const ls = { get(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

// ===== КЛАССИФИКАЦИЯ =====
function classifyChannel(name, group) {
    const f = (name + ' ' + group).toLowerCase();
    if (/детектив|кино|фильм|сериал|cinema|movie|боевик|триллер|ужасы|фантастика|драма|комедия/i.test(f)) return 'Кино';
    if (/мульт|сказк|kids|cartoon|детск|карусел|смешарики|маша/i.test(f)) return 'Детские';
    if (/спорт|матч|футбол|хоккей|бокс|sport|football/i.test(f)) return 'Спорт';
    if (/новост|news|вести|24|рбк|известия/i.test(f)) return 'Новости';
    if (/муз|music|mtv|europa|хит|радио/i.test(f)) return 'Музыка';
    return 'Русские';
}

// ===== ПАРСЕР =====
function parseM3U(text, sourceCat) {
    const out = [];
    let name = '', grp = '', logo = '';
    const isHttps = location.protocol === 'https:';
    for (const raw of String(text||'').split(/\r?\n/)) {
        const l = raw.trim();
        if (!l) continue;
        if (l.startsWith('#EXTINF:')) {
            const gm = l.match(/group-title="([^"]*)"/i); grp = gm ? gm[1].trim() : '';
            const lm = l.match(/tvg-logo="([^"]*)"/i); logo = lm ? lm[1] : '';
            const ci = l.lastIndexOf(','); name = ci !== -1 ? l.slice(ci+1).trim() : '';
            name = name.replace(/\[.*?\]|\(.*?\)/g,'').trim();
        } else if (!l.startsWith('#') && /^https?:\/\//i.test(l)) {
            if (isHttps && l.startsWith('http://')) { name=''; grp=''; logo=''; continue; }
            let cat = classifyChannel(name, grp);
            if (sourceCat === 'Детские') cat = 'Детские';
            else if (sourceCat === 'Кино') cat = 'Кино';
            else if (sourceCat === 'Спорт') cat = 'Спорт';
            else if (sourceCat === 'Новости') cat = 'Новости';
            else if (sourceCat === 'Музыка') cat = 'Музыка';
            out.push({
                id: 'c-'+out.length+'-'+Math.random().toString(36).slice(2,6),
                name: name || `Канал ${out.length+1}`, url: l, logo, category: cat
            });
            name=''; grp=''; logo='';
        }
    }
    return out;
}

// ===== ЗАГРУЗКА =====
async function loadPlaylists() {
    $('syncStatusText').innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>Загрузка...`;
    try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 6000);
        const resp = await fetch(PRIMARY_SOURCE.url, { signal: ctrl.signal });
        clearTimeout(t);
        if (!resp.ok) throw new Error();
        const text = await resp.text();
        const channels = parseM3U(text, PRIMARY_SOURCE.cat);
        
        S.channels = channels.map((c,i)=>({ ...c, num: i+1 }));
        renderCats(); renderList();
        
        let startIdx = 0;
        const firstIdx = S.channels.findIndex(c => /первый|1 канал|channel one/i.test(c.name));
        if (firstIdx !== -1) startIdx = firstIdx;
        playChannel(startIdx);
        
        loadSecondary();
    } catch(e) {
        $('syncStatusText').innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span>Ошибка`;
    }
}

async function loadSecondary() {
    const bg = $('syncStatusText');
    let loaded = 0;
    await Promise.allSettled(SECONDARY_SOURCES.map(async (src) => {
        try {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 10000);
            const resp = await fetch(src.url, { signal: ctrl.signal });
            clearTimeout(t);
            if (!resp.ok) return;
            const text = await resp.text();
            const channels = parseM3U(text, src.cat);
            if (channels.length > 0) {
                loaded++;
                const existingUrls = new Set(S.channels.map(c => c.url));
                channels.forEach(c => { if (!existingUrls.has(c.url)) S.channels.push(c); });
                S.channels = S.channels.map((c,i)=>({ ...c, num: i+1 }));
                renderCats(); renderList();
                bg.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span>${S.channels.length} каналов (+${loaded} ист.)`;
            }
        } catch(e) {}
    }));
    bg.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span>${S.channels.length} каналов (все загружены)`;
}

// ===== ОТРИСОВКА =====
function renderCats() {
    $('categoryTabs').innerHTML = CATS.map(([id, label, ic]) => {
        const active = S.cat === id;
        let cnt = id === 'Все' ? S.channels.length : id === 'Избранное' ? S.favs.size : S.channels.filter(c => c.category === id).length;
        return `<button type="button" data-cat="${id}" class="shrink-0 px-3 py-1.5 rounded-lg text-[11px] font-semibold flex items-center gap-1 border cursor-pointer transition-colors ${active ? 'bg-blue-600 text-white border-blue-500' : 'bg-white/5 text-slate-300 border-white/10 hover:bg-white/10'}"><span>${ic}</span><span>${label}</span><span class="opacity-60">${cnt}</span></button>`;
    }).join('');
}

function filterChannels() {
    const q = S.q.trim().toLowerCase();
    return S.channels.filter(c => {
        if (S.cat !== 'Все') {
            if (S.cat === 'Избранное') { if (!S.favs.has(c.id)) return false; }
            else { if (c.category !== S.cat) return false; }
        }
        if (q && !c.name.toLowerCase().includes(q)) return false;
        return true;
    });
}

function cardHTML(c) {
    const isPlay = c.id === S.channels[S.idx]?.id;
    const isFav = S.favs.has(c.id);
    const logoContent = c.logo 
        ? `<img src="${c.logo}" class="w-full h-full object-contain" loading="lazy" onerror="this.style.display='none'; this.parentElement.textContent='${String(c.num).padStart(2,'0')}';">`
        : String(c.num).padStart(2,'0');
    return `<div data-cid="${c.id}" class="channel-card group p-2.5 rounded-2xl border flex items-center justify-between gap-3 cursor-pointer transition-all ${isPlay ? 'bg-blue-600/20 border-blue-500/50 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'bg-white/5 hover:bg-white/10 border-white/5'}">
        <div class="flex items-center gap-3 min-w-0">
            <div class="w-12 h-12 rounded-xl bg-slate-800 flex items-center justify-center text-white font-bold text-sm shrink-0 border border-white/10 overflow-hidden p-1">${logoContent}</div>
            <div class="min-w-0">
                <div class="font-bold text-sm text-white truncate">${c.name}</div>
                <div class="text-[11px] text-slate-400 mt-0.5">${c.category}</div>
            </div>
        </div>
        <button type="button" data-fav="${c.id}" class="fav-btn ${isFav ? 'active' : 'text-slate-500'} p-2 rounded-lg hover:bg-white/10 cursor-pointer shrink-0 transition-colors">
            <svg class="w-4 h-4" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
        </button>
    </div>`;
}

function renderList() {
    const filtered = filterChannels();
    $('channelsCountBadge').textContent = filtered.length;
    if (filtered.length === 0) { container.innerHTML = '<div class="text-center py-10 text-slate-500 text-sm">Нет каналов</div>'; return; }
    const vis = filtered.slice(0, visible);
    let html = vis.map(cardHTML).join('');
    if (vis.length < filtered.length) html += `<button data-action="more" class="w-full py-3 rounded-xl bg-white/5 text-slate-300 hover:bg-white/10 font-semibold text-sm cursor-pointer transition-colors">Показать ещё</button>`;
    requestAnimationFrame(() => { container.innerHTML = html; });
}

// ===== ВОСПРОИЗВЕДЕНИЕ И АВТО-ЗВУК =====
function playChannel(idx) {
    if (idx < 0 || idx >= S.channels.length) return;
    const ch = S.channels[idx];
    S.idx = idx;
    
    updateChannelUI(ch);
    
    $('errorOverlay').classList.add('hidden');
    $('loaderOverlay').classList.remove('hidden');
    $('loaderText').textContent = `Загрузка: ${ch.name}`;
    $('loaderSubText').textContent = 'Соединение...';
    if (S.sidebar) toggleSidebar(false);
    
    if (S.hls) { try { S.hls.destroy(); } catch(e){} S.hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();

    const url = ch.url;
    const isDirect = /\.(mp3|aac|mp4|webm)(\?|$)/i.test(url);

    if (!isDirect && typeof Hls !== 'undefined' && Hls.isSupported()) {
        const hls = new Hls({
            enableWorker: true, lowLatencyMode: true, backBufferLength: 10, maxBufferLength: 10,
            manifestLoadingTimeOut: 5000, manifestLoadingMaxRetry: 1,
            levelLoadingTimeOut: 5000, fragLoadingTimeOut: 6000,
            xhrSetup: x => { x.withCredentials = false; }
        });
        S.hls = hls;
        hls.loadSource(url);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            updateResolution(hls.levels);
            populateQualityMenu(hls.levels);
            tryPlay();
        });
        
        hls.on(Hls.Events.LEVEL_SWITCHED, (e, d) => {
            const l = hls.levels[d.level];
            if (l) $('currentStreamResolution').textContent = `${l.height ? l.height + 'p' : 'HD'}`;
        });
        
        hls.on(Hls.Events.ERROR, (e, d) => {
            if (d.fatal) handleFail(ch);
        });
    } else {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
            $('currentStreamResolution').textContent = 'Прямой';
            tryPlay();
        }, { once: true });
        video.addEventListener('error', () => handleFail(ch), { once: true });
    }
}

// ФУНКЦИЯ АВТО-ЗВУКА
function tryPlay() {
    // 1. Снимаем mute (пробуем включить со звуком)
    video.muted = false; 
    updateMute();
    
    const p = video.play();
    if (p && p.catch) {
        p.catch(() => {
            // 2. Если браузер заблокировал звук, включаем mute и запускаем
            video.muted = true; 
            updateMute();
            video.play().catch(() => {});
            showToast('Нажмите на экран для включения звука');
            
            // 3. Включаем звук при первом клике куда угодно
            const unmute = () => {
                video.muted = false;
                updateMute();
                document.removeEventListener('click', unmute);
            };
            document.addEventListener('click', unmute);
        });
    }
}

function updateChannelUI(ch) {
    $('currentChannelNumber').textContent = '#' + String(ch.num).padStart(2, '0');
    $('currentChannelName').textContent = ch.name;
    $('currentChannelCategory').textContent = ch.category;
    const logoEl = $('currentChannelLogo');
    if (ch.logo) {
        logoEl.innerHTML = `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.style.display='none'; this.parentElement.textContent='${ch.num}';">`;
    } else {
        logoEl.innerHTML = String(ch.num);
    }
}

function updateResolution(levels) {
    if (!levels || !levels.length) return;
    let best = levels.length - 1;
    for (let i = levels.length - 1; i >= 0; i--) {
        if ((levels[i].height || 720) <= screen.height * 1.1) { best = i; break; }
    }
    if (S.hls) S.hls.currentLevel = best;
    const h = levels[best]?.height;
    if (h) $('currentStreamResolution').textContent = `${h}p`;
}

function handleFail(ch) {
    $('loaderOverlay').classList.add('hidden');
    $('errorOverlay').classList.remove('hidden');
    $('errorDetails').textContent = `«${ch.name}» недоступен. Попробуйте другой.`;
}

function populateQualityMenu(levels) {
    const list = $('qualityList');
    if (!levels || levels.length === 0) { list.innerHTML = '<div class="text-xs text-slate-500 text-center py-2">Нет уровней</div>'; return; }
    list.innerHTML = levels.map((l, i) => {
        const h = l.height || 0;
        const isActive = S.hls && S.hls.currentLevel === i;
        return `<button type="button" data-level="${i}" class="w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${isActive ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-white/10'}">${h ? h + 'p' : '#' + (i+1)} ${l.bitrate ? '• ' + (l.bitrate / 1e6).toFixed(1) + ' Mbps' : ''}</button>`;
    }).join('');
}

// ===== СОБЫТИЯ =====
$('categoryTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    S.cat = btn.dataset.cat;
    visible = PAGE;
    renderCats(); renderList();
});

container.addEventListener('click', (e) => {
    const more = e.target.closest('[data-action="more"]');
    if (more) { visible += PAGE; renderList(); return; }
    const favBtn = e.target.closest('[data-fav]');
    if (favBtn) {
        e.stopPropagation();
        const id = favBtn.dataset.fav;
        if (S.favs.has(id)) S.favs.delete(id); else S.favs.add(id);
        ls.set('ru_favs', [...S.favs]); renderList(); renderCats();
        return;
    }
    const card = e.target.closest('.channel-card');
    if (card) {
        const idx = S.channels.findIndex(c => c.id === card.dataset.cid);
        if (idx !== -1) playChannel(idx);
    }
});

// Загрузка избранного
const savedFavs = ls.get('ru_favs', []);
if (Array.isArray(savedFavs)) S.favs = new Set(savedFavs);

// Управление
function toggleSidebar(force) {
    S.sidebar = typeof force === 'boolean' ? force : !S.sidebar;
    if (S.sidebar) $('channelsSidebar').classList.remove('-translate-x-full','hidden');
    else $('channelsSidebar').classList.add('-translate-x-full');
}
function toggleMute() { video.muted = !video.muted; updateMute(); }
function updateMute() { $('volHighIcon').classList.toggle('hidden', video.muted); $('volMuteIcon').classList.toggle('hidden', !video.muted); }

let toastT;
function showToast(msg) { 
    $('toastMessage').textContent = msg; 
    $('toastNotification').classList.remove('hidden'); 
    clearTimeout(toastT); 
    toastT = setTimeout(() => $('toastNotification').classList.add('hidden'), 4000); 
}

function showOsd() {
    $('osdWrapper').classList.remove('osd-hidden');
    $('osdWrapper').classList.add('osd-visible');
    clearTimeout(S.osdT);
    S.osdT = setTimeout(() => { if (!video.paused) { $('osdWrapper').classList.add('osd-hidden'); $('osdWrapper').classList.remove('osd-visible'); } }, 5000);
}

// Привязка кнопок
$('toggleSidebarBtn').onclick = () => toggleSidebar();
$('closeSidebarBtn').onclick = () => toggleSidebar(false);
$('openSidebarFromErrorBtn').onclick = () => { $('errorOverlay').classList.add('hidden'); toggleSidebar(true); };
$('prevChannelBtn').onclick = () => playChannel(S.idx - 1);
$('nextChannelBtn').onclick = () => playChannel(S.idx + 1);
$('nextChannelErrorBtn').onclick = () => { $('errorOverlay').classList.add('hidden'); playChannel(S.idx + 1); };
$('playPauseBtn').onclick = () => { video.paused ? video.play() : video.pause(); };
$('muteToggleBtn').onclick = toggleMute;
$('fullscreenBtn').onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); };
$('channelSearchInput').addEventListener('input', debounce(e => { S.q = e.target.value; visible = PAGE; renderList(); }, 200));

$('openQualityMenuBtn').onclick = () => {
    const menu = $('qualityMenu');
    menu.classList.toggle('hidden');
    if (!menu.classList.contains('hidden') && S.hls && S.hls.levels) populateQualityMenu(S.hls.levels);
};

$('qualityList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-level]');
    if (!btn || !S.hls) return;
    S.hls.currentLevel = parseInt(btn.dataset.level, 10);
    $('qualityMenu').classList.add('hidden');
});

// ===== ИНФО МОДАЛКА =====
$('openInfoBtn').onclick = () => {
    // Определяем регион и время
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    $('infoRegion').textContent = tz || 'Неизвестно';
    
    const now = new Date();
    $('infoTime').textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    
    $('infoModal').classList.remove('hidden');
};

$('closeInfoBtn').onclick = () => $('infoModal').classList.add('hidden');
$('closeInfoFooterBtn').onclick = () => $('infoModal').classList.add('hidden');

// Видео события
video.addEventListener('playing', () => {
    $('loaderOverlay').classList.add('hidden');
    $('errorOverlay').classList.add('hidden');
    $('pauseIcon').classList.remove('hidden');
    $('playIcon').classList.add('hidden');
    showOsd();
});
video.addEventListener('pause', () => {
    $('pauseIcon').classList.add('hidden');
    $('playIcon').classList.remove('hidden');
    showOsd();
});

// Глобальные события
window.addEventListener('mousemove', showOsd);
window.addEventListener('touchstart', showOsd);
window.addEventListener('keydown', showOsd);

// Старт
if (innerWidth < 640) toggleSidebar(false);
loadPlaylists();
</script>
</body>
</html>
